buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.2-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
targetCompatibility = sourceCompatibility =
compileJava.targetCompatibility = compileJava.sourceCompatibility = JavaVersion.VERSION_1_8

version = "1.0.0"
group= "ru.wertyfiregames.craftablecreatures"
archivesBaseName = "CraftableCreatures-1.9.4"

minecraft {
    version = "1.9.4-12.17.0.2317-1.9.4"
    runDir = "run"
    mappings = "snapshot_20160518"
    makeObfSourceJar = false
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

build.doFirst {
    Scanner scanner = new Scanner(System.in)
    println 'Are you updated version numbers??? [y/n]'

    def input = scanner.nextLine()

    if (input.toLowerCase() == 'y') println 'Continuing build...'
    else if (input.toLowerCase() == 'n') {
        println 'Build cancelled'
        throw new GradleException('Build cancelled.')
    } else throw new GradleException('Incorrect input!')
}

repositories {
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

dependencies {
    compile 'mezz.jei:jei_1.9.4:3.6.8.225'
}

processResources
{
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version':project.version,
        'mcversion':project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}